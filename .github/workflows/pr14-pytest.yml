name: Pytest

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      # Bootstrap da migração do CI: permite validar a própria PR #44 antes
      # de o gatilho pull_request desta versão existir na branch padrão.
      - feat/post-sale-status-sync-8.3.0-a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full SQLite test suite
        run: python -m pytest -q tests/
