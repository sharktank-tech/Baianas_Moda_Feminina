name: Pytest

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check diff whitespace
        run: git diff --check

      - name: Prove local .env cannot leak into OAuth tests
        run: |
          test ! -e .env
          trap 'rm -f .env' EXIT
          printf 'ALIEXPRESS_OAUTH_AUTHORIZE_URL=\nALIEXPRESS_SMOKE_BUYER_FREIGHT=1\nVERCEL_ENV=preview\n' > .env
          python -m pytest -q tests/test_acquisition_sessions.py tests/test_aliexpress_oauth.py

      - name: Run full SQLite test suite
        run: python -m pytest -q tests/

  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/pollotest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pollotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Guard DATABASE_URL aponta para a instância de teste
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.get_backend_name() == "postgresql", url
          assert url.host in ("127.0.0.1", "localhost", "::1"), url.host
          assert url.database == "pollotest", url.database
          print("DATABASE_URL OK ->", url.render_as_string(hide_password=True))
          PY

      - name: Run PostgreSQL integration suite (payment, fulfillment, stock cleanup)
        run: >
          python -m pytest -q
          tests/test_canary_evidence_pg.py
          tests/test_canary_evidence_function_search_path_pg.py
          tests/test_aliexpress_controlled_canary_pg.py
          tests/test_aliexpress_oauth_pg.py
          tests/test_aliexpress_payment_guard_pg.py
          tests/test_aliexpress_reconciliation_pg.py
          tests/test_aliexpress_single_live_canary_pg.py
          tests/test_aliexpress_status_sync_pg.py
          tests/test_aliexpress_submission_pg.py
          tests/test_draft_import_pg.py
          tests/test_stock_reservation_cleanup_pg.py
          tests/test_payment_concurrency_pg.py
          tests/test_checkout_idempotency_pg.py
          tests/test_reservation_expiry_backfill_pg.py
          tests/test_expired_state_backfill_pg.py
          tests/test_manual_review_decision_pg.py
          tests/test_checkout_recovery_skip_pg.py
          tests/test_supplier_freight_quotes_pg.py
          tests/test_acquisition_costs_pg.py
          tests/test_variant_selected_size_pg.py

      - name: Prova observável do bloqueio (2o INSERT aguardando unicidade)
        run: >
          python -m pytest -q -s
          tests/test_aliexpress_payment_guard_pg.py::test_two_concurrent_after_approval_no_duplicate_and_no_exception

  pytest-pricing-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/pollotest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pollotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Guard DATABASE_URL aponta para a instância de teste
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.get_backend_name() == "postgresql", url
          assert url.host in ("127.0.0.1", "localhost", "::1"), url.host
          assert url.database == "pollotest", url.database
          assert url.database.startswith("pollo"), url.database
          print("DATABASE_URL OK ->", url.render_as_string(hide_password=True))
          PY

      - name: Check diff whitespace
        run: git diff --check

      - name: Run pricing PostgreSQL suite (validacao 23514+constraint + scripts readonly)
        run: >
          python -m pytest -v
          tests/test_pricing_publication_pg.py
          tests/test_verify_future_canary_readonly_pg.py
          tests/test_verify_payment_evidence_readonly_pg.py

