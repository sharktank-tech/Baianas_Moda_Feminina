name: Pytest

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check diff whitespace
        run: git diff --check

      - name: Prove local .env cannot leak into OAuth tests
        run: |
          test ! -e .env
          trap 'rm -f .env' EXIT
          printf 'ALIEXPRESS_OAUTH_AUTHORIZE_URL=\nALIEXPRESS_SMOKE_BUYER_FREIGHT=1\nVERCEL_ENV=preview\n' > .env
          python -m pytest -q tests/test_acquisition_sessions.py tests/test_aliexpress_oauth.py

      - name: Run full SQLite test suite
        run: python -m pytest -q tests/

  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/baianastest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baianastest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Guard DATABASE_URL aponta para a instância de teste
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.get_backend_name() == "postgresql", url
          assert url.host in ("127.0.0.1", "localhost", "::1"), url.host
          assert url.database == "baianastest", url.database
          print("DATABASE_URL OK ->", url.render_as_string(hide_password=True))
          PY

      - name: Run PostgreSQL integration suite (payment, fulfillment, stock cleanup)
        run: >
          python -m pytest -q
          tests/test_canary_evidence_pg.py
          tests/test_canary_evidence_function_search_path_pg.py
          tests/test_aliexpress_controlled_canary_pg.py
          tests/test_aliexpress_oauth_pg.py
          tests/test_aliexpress_payment_guard_pg.py
          tests/test_aliexpress_reconciliation_pg.py
          tests/test_aliexpress_single_live_canary_pg.py
          tests/test_aliexpress_status_sync_pg.py
          tests/test_aliexpress_submission_pg.py
          tests/test_draft_import_pg.py
          tests/test_shipping_origin_pg.py
          tests/test_stock_reservation_cleanup_pg.py
          tests/test_payment_concurrency_pg.py
          tests/test_checkout_idempotency_pg.py
          tests/test_reservation_expiry_backfill_pg.py
          tests/test_expired_state_backfill_pg.py
          tests/test_manual_review_decision_pg.py
          tests/test_checkout_recovery_skip_pg.py
          tests/test_supplier_freight_quotes_pg.py
          tests/test_acquisition_costs_pg.py
          tests/test_variant_selected_size_pg.py
          tests/test_variant_supplier_stock_pg.py
          tests/test_aliexpress_sync_attempts_pg.py
          tests/test_published_sync_concurrency_pg.py
          tests/test_variant_availability_release_pg.py
          tests/test_hero_slides_pg.py
          tests/test_manual_dispatch_pg.py

      - name: Prova disponibilidade x restituição (3 testes, sem skips)
        run: |
          set -o pipefail
          python -m pytest -v tests/test_variant_availability_release_pg.py 2>&1 | tee /tmp/avail_pg.log
          grep -E " 3 passed in " /tmp/avail_pg.log
          ! grep -E " skipped| SKIPPED" /tmp/avail_pg.log

      - name: Prova observável do bloqueio (2o INSERT aguardando unicidade)
        run: >
          python -m pytest -q -s
          tests/test_aliexpress_payment_guard_pg.py::test_two_concurrent_after_approval_no_duplicate_and_no_exception

  pytest-pricing-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/baianastest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baianastest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Guard DATABASE_URL aponta para a instância de teste
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.get_backend_name() == "postgresql", url
          assert url.host in ("127.0.0.1", "localhost", "::1"), url.host
          assert url.database == "baianastest", url.database
          assert url.database.startswith("pollo"), url.database
          print("DATABASE_URL OK ->", url.render_as_string(hide_password=True))
          PY

      - name: Check diff whitespace
        run: git diff --check

      - name: Run pricing PostgreSQL suite (validacao 23514+constraint + scripts readonly)
        run: >
          python -m pytest -v
          tests/test_pricing_publication_pg.py
          tests/test_verify_future_canary_readonly_pg.py
          tests/test_verify_payment_evidence_readonly_pg.py


  pytest-postgres-validacao-0041:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pytest-postgres
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/baianastest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baianastest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Preparar schema, tabela e registros sinteticos
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          conn = psycopg2.connect(
              host=url.host, port=url.port or 5432, dbname=url.database,
              user=url.username, password=url.password)
          cur = conn.cursor()
          cur.execute("CREATE SCHEMA IF NOT EXISTS baianas_moda_feminina")
          cur.execute("""
              CREATE TABLE IF NOT EXISTS baianas_moda_feminina.newsletter_subscribers (
                id UUID PRIMARY KEY,
                email VARCHAR(150) NOT NULL UNIQUE,
                created_at TIMESTAMP
              )
          """)
          cur.execute("""
              INSERT INTO baianas_moda_feminina.newsletter_subscribers (id, email, created_at)
              VALUES
                ('11111111-1111-1111-1111-111111111111', 'sintetico.0041.a@descartavel.test', now()),
                ('22222222-2222-2222-2222-222222222222', 'sintetico.0041.b@descartavel.test', now()),
                ('33333333-3333-3333-3333-333333333333', 'sintetico.0041.c@descartavel.test', now())
              ON CONFLICT (id) DO NOTHING
          """)
          conn.commit()
          cur.execute(
              "SELECT id::text, email, created_at::text "
              "FROM baianas_moda_feminina.newsletter_subscribers ORDER BY id"
          )
          snapshot = cur.fetchall()
          import json
          with open("/tmp/0041_snapshot.json", "w", encoding="utf-8") as f:
              json.dump(snapshot, f)
          print("Sinteticos inseridos:", len(snapshot))
          cur.close()
          conn.close()
          print("Schema/tabela sinteticos: OK")
          PY

      - name: Aplicar e reaplicar migração 0041 (idempotencia)
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          conn = psycopg2.connect(
              host=url.host, port=url.port or 5432, dbname=url.database,
              user=url.username, password=url.password)
          with open("migrations/0041_newsletter_unsubscribe.sql", encoding="utf-8") as f:
              sql = f.read()
          sql_limpo = "\n".join(
              linha for linha in sql.splitlines()
              if not linha.strip().startswith("\\")
          )
          cur = conn.cursor()
          cur.execute(sql_limpo)
          conn.commit()
          print("Aplicacao 0041: OK")
          cur.execute(sql_limpo)
          conn.commit()
          print("Reaplicacao 0041 (idempotente): OK")
          cur.close()
          conn.close()
          PY

      - name: Executar validador 0041
        run: python migrations/validate_0041.py

      - name: Verificar preservacao de registros
        run: |
          python - <<'PY'
          import json
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          esperado_ids = {
              "11111111-1111-1111-1111-111111111111",
              "22222222-2222-2222-2222-222222222222",
              "33333333-3333-3333-3333-333333333333",
          }
          esperado_emails = {
              "11111111-1111-1111-1111-111111111111":
                  "sintetico.0041.a@descartavel.test",
              "22222222-2222-2222-2222-222222222222":
                  "sintetico.0041.b@descartavel.test",
              "33333333-3333-3333-3333-333333333333":
                  "sintetico.0041.c@descartavel.test",
          }
          with open("/tmp/0041_snapshot.json", encoding="utf-8") as f:
              snapshot = json.load(f)
          snapshot_por_id = {row[0]: row for row in snapshot}
          assert set(snapshot_por_id) == esperado_ids, snapshot_por_id
          for sid, email in esperado_emails.items():
              assert snapshot_por_id[sid][1] == email, snapshot_por_id[sid]

          url = make_url(os.environ["DATABASE_URL"])
          conn = psycopg2.connect(
              host=url.host, port=url.port or 5432, dbname=url.database,
              user=url.username, password=url.password)
          cur = conn.cursor()
          cur.execute(
              "SELECT id::text, email, created_at::text, "
              "unsubscribed_at, resubscribed_at "
              "FROM baianas_moda_feminina.newsletter_subscribers ORDER BY id"
          )
          rows = cur.fetchall()
          assert len(rows) == 3, rows
          for row in rows:
              sid, email, created_at, unsub, resub = row
              original = snapshot_por_id[sid]
              assert sid == original[0], row
              assert email == original[1], row          # email preservado
              assert created_at == original[2], row    # created_at preservado
              assert unsub is None, row                 # supressao nula
              assert resub is None, row
              print(f"OK {sid} {email} created_at={created_at}")
          cur.close()
          conn.close()
          print("Preservacao de registros e valores originais: confirmada")
          PY
