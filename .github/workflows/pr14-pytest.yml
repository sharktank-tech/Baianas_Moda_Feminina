name: PR14 pytest validation

on:
  push:
    branches:
      - safety/aliexpress-third-post-hardoff-8.0.11s

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run full SQLite test suite
        run: python -m pytest -q tests/
