name: PR14 pytest validation

on:
  push:
    branches:
      - safety/aliexpress-third-diagnostic-canary
      - fix/aliexpress-invalid-appkey-reconciliation-8.0.11t
      - fix/aliexpress-placeorder-sync-8.0.11u
      - fix/aliexpress-address-reconciliation-8.0.11w
      - fix/aliexpress-brazil-address-8.0.11x
      - fix/aliexpress-snapshot-revision-8.0.11y
      - fix/aliexpress-br-tax-id-8.0.12a
      - fix/aliexpress-cpf-admin-8.0.12b
      - feat/checkout-cpf-8.0.12c
      - feat/aliexpress-production-fulfillment-8.1.0
      - feat/aliexpress-production-preflight-8.1.0
      - feat/aliexpress-production-orchestrator-8.1.0
      - feat/aliexpress-postpayment-autodispatch-8.1.0
      - feat/aliexpress-production-circuit-breaker-8.1.0
      - feat/aliexpress-production-observability-8.1.0

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run full SQLite test suite
        run: python -m pytest -q tests/
