{% extends "base.html" %}

{% block title %}Minha Conta{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 flex-grow">
    <h2 class="text-2xl font-bold mb-4">Minha Conta</h2>

    <div class="bg-white shadow-md rounded-lg p-6">
        <h3 class="text-xl font-semibold mb-4">Detalhes do Usuário</h3>

        <div class="space-y-2 text-gray-700">
            <p><strong>Nome:</strong> {{ username }}</p>
            <p><strong>Email:</strong> {{ email }}</p>
            <p><strong>Telefone:</strong> {{ telefone }}</p>
        </div>

        <div class="mt-8">
            <h3 class="text-xl font-semibold mb-4">Ações</h3>

            <div class="flex flex-col gap-3">
                <a href="{{ url_for('main.edit_account') }}"
                   class="text-blue-600 hover:text-blue-800 hover:underline">
                    Editar Conta
                </a>

                <form action="{{ url_for('main.delete_account') }}" method="POST">
                    <button type="submit"
                            class="text-red-600 hover:text-red-800 hover:underline">
                        Excluir Conta
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
