{% extends "base.html" %}

{% block title %}Editar conta — {% if site and site.name %}{{ site.name }}{% else %}Pollo Modas{% endif %}{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/conta.css') }}">
{% endblock %}

{% block content %}
<section class="account-stage">
  <div class="auth-card auth-card--single">
    <div class="auth-form-side">
      <div class="auth-form-head">
        <h1 class="auth-form-title">Editar conta</h1>
        <p class="auth-form-sub">Atualize seus dados de acesso.</p>
      </div>

      <form action="{{ url_for('main.edit_account') }}" method="POST" novalidate>
        <div class="field">
          <label for="username" class="field-label">Nome</label>
          <input type="text" id="username" name="username" class="field-input"
                 value="{{ username }}" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="email" class="field-label">E-mail</label>
          <input type="email" id="email" name="email" class="field-input"
                 value="{{ email }}" autocomplete="email" required>
        </div>

        <button type="submit" class="btn-account" style="margin-top:0.5rem;">Salvar alterações</button>
      </form>

      <p class="auth-alt">
        <a href="{{ url_for('main.conta') }}">← Voltar para minha conta</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
