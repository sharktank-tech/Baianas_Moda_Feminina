{% extends "base.html" %}

{% block title %}Editar Promoção{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Editar Promoção
        </h1>

        <p class="text-gray-500 mt-2">
            Atualize as informações da promoção.
        </p>
    </div>

    <form
        method="POST"
        class="bg-white rounded-2xl shadow p-8 space-y-6"
    >

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome da promoção
            </label>

            <input
                type="text"
                name="name"
                required
                value="{{ promotion.name or '' }}"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Ex: Coleção Copa do Mundo"
            >
        </div>

        <!-- URL da imagem -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                URL da imagem
            </label>

            <input
                type="url"
                name="image"
                value="{{ promotion.image or '' }}"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="https://..."
            >

            {% if promotion.image %}
            <div class="mt-4">
                <img
                    src="{{ promotion.image }}"
                    alt="{{ promotion.name }}"
                    class="w-40 h-40 object-cover rounded-xl border shadow-sm"
                >
            </div>
            {% endif %}
        </div>

        <!-- Preços -->
        <div class="grid md:grid-cols-2 gap-6">

            <!-- Preço original -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço original (R$)
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="original_price"
                    value="{{ promotion.original_price or '' }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="199.90"
                >
            </div>

            <!-- Preço promocional -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço promocional (R$)
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="sale_price"
                    value="{{ promotion.sale_price or '' }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="99.90"
                >
            </div>

        </div>

        <!-- Promoção ativa -->
        <div class="flex items-center gap-3">

            <input
                type="checkbox"
                id="is_active"
                name="is_active"
                {% if promotion.is_active %}checked{% endif %}
                class="w-5 h-5 text-pink-600 rounded"
            >

            <label
                for="is_active"
                class="text-gray-700"
            >
                Promoção ativa
            </label>

        </div>

        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 transition text-white px-8 py-3 rounded-lg font-medium"
            >
                Salvar Alterações
            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 transition px-8 py-3 rounded-lg font-medium"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
