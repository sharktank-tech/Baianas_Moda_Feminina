{% extends "base.html" %}

{% block title %}Adicionar Promoção{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Adicionar Promoção
        </h1>

        <p class="text-gray-500 mt-2">
            Cadastre uma nova promoção para exibição na loja.
        </p>
    </div>

    <form
        method="POST"
        class="bg-white rounded-2xl shadow p-8 space-y-6"
    >

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome da promoção
            </label>

            <input
                type="text"
                name="name"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Ex: Coleção Copa do Mundo"
            >
        </div>

        <!-- URL da imagem -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                URL da imagem
            </label>

            <input
                type="url"
                name="image"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="https://..."
            >
        </div>

        <!-- Preços -->
        <div class="grid md:grid-cols-2 gap-6">

            <!-- Preço original -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço original (R$)
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="original_price"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="199.90"
                >
            </div>

            <!-- Preço promocional -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço promocional (R$)
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="sale_price"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="99.90"
                >
            </div>

        </div>

        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 transition text-white px-8 py-3 rounded-lg font-medium"
            >
                Salvar Promoção
            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 transition px-8 py-3 rounded-lg font-medium"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
