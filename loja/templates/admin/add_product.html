<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="static/styles/animation.css"> <!-- Link para o CSS -->
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.jpg') }}">
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-black text-white px-4 py-2 flex justify-between items-center">
    <h1 class="text-xl font-bold">Painel Administrativo</h1>
    <ul class="flex gap-4">
      <li><a href="{{ url_for('admin.admin_dashboard') }}" class="hover:underline">Dashboard</a></li>
      <li><a href="#" class="hover:underline">Produtos</a></li>
      <li><a href="#" class="hover:underline">Usuários</a></li>
      <li><a href="{{ url_for('main.logout') }}" class="hover:underline">Sair</a></li>
    </ul>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="mt-6 px-4 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-center">Adicionar Produto</h1>

    <form method="POST" class="bg-white p-6 rounded shadow">
      <div class="mb-4">
        <label for="name" class="block text-lg font-medium text-gray-700">Nome do Produto</label>
        <input type="text" id="name" name="name" placeholder="Nome do Produto" required
               class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-black">
      </div>

      <div class="mb-4">
        <label for="description" class="block text-lg font-medium text-gray-700">Descrição</label>
        <textarea id="description" name="description" placeholder="Descrição"
                  class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"></textarea>
      </div>

      <div class="mb-4">
        <label for="price" class="block text-lg font-medium text-gray-700">Preço</label>
        <input type="number" step="0.01" id="price" name="price" placeholder="Preço" required
               class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-black">
      </div>

      <div class="mb-4">
        <label for="image" class="block text-lg font-medium text-gray-700">URL da Imagem</label>
        <input type="text" id="image" name="image" placeholder="URL da Imagem" required
               class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-black">
      </div>

      <button type="submit" class="w-full bg-black text-white py-2 rounded hover:bg-gray-800">Salvar</button>
    </form>
  </main>

</body>
</html>
