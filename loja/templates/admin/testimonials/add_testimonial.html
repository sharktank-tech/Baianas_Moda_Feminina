{% extends "base.html" %}

{% block title %}Adicionar Depoimento{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Adicionar Depoimento
        </h1>

        <p class="text-gray-500 mt-2">
            Cadastre um novo depoimento para exibição na loja.
        </p>
    </div>

    <form
        method="POST"
        class="bg-white rounded-2xl shadow p-8 space-y-6"
    >

        {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}

        <!-- Autor -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome do cliente
            </label>

            <input
                type="text"
                name="author"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Ex: Maria Silva"
            >
        </div>

        <!-- Depoimento -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Depoimento
            </label>

            <textarea
                name="text"
                rows="5"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Escreva o depoimento do cliente..."
            ></textarea>
        </div>

        <!-- Avaliação -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Avaliação
            </label>

            <select
                name="rating"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
            >
                <option value="5" selected>⭐⭐⭐⭐⭐ (5 estrelas)</option>
                <option value="4">⭐⭐⭐⭐ (4 estrelas)</option>
                <option value="3">⭐⭐⭐ (3 estrelas)</option>
                <option value="2">⭐⭐ (2 estrelas)</option>
                <option value="1">⭐ (1 estrela)</option>
            </select>
        </div>

        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 transition text-white px-8 py-3 rounded-lg font-medium"
            >
                Salvar Depoimento
            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 transition px-8 py-3 rounded-lg font-medium"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
