{% extends "base.html" %}

{% block title %}Adicionar Usuário{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Adicionar Usuário
        </h1>

        <p class="text-gray-500 mt-2">
            Crie uma nova conta de usuário.
        </p>
    </div>


    <form method="POST"
          class="bg-white rounded-2xl shadow p-8 space-y-6">

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome
            </label>

            <input
                type="text"
                name="name"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="Nome completo">
        </div>


        <!-- E-mail -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                E-mail
            </label>

            <input
                type="email"
                name="email"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="usuario@email.com">
        </div>


        <!-- Telefone -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Telefone
            </label>

            <input
                type="text"
                name="phone"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="(63) 99999-9999">
        </div>


        <!-- Senha -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Senha
            </label>

            <input
                type="password"
                name="password"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="********">
        </div>


        <!-- Confirmar senha -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Confirmar senha
            </label>

            <input
                type="password"
                name="confirm_password"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="********">
        </div>


        <!-- Administrador -->
        <div class="flex items-center gap-3">

            <input
                type="checkbox"
                id="is_admin"
                name="is_admin"
                class="w-5 h-5">

            <label
                for="is_admin"
                class="text-gray-700">

                Conceder permissões de administrador

            </label>

        </div>


        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 text-white px-8 py-3 rounded-lg">

                Criar Usuário

            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 px-8 py-3 rounded-lg">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
