{% extends "base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Editar Produto
        </h1>

        <p class="text-gray-500 mt-2">
            Atualize as informações do produto.
        </p>
    </div>

    <form
        method="POST"
        action="{{ url_for('admin.edit_product', id=product.id) }}"
        class="bg-white rounded-2xl shadow p-8 space-y-6"
    >

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome do produto
            </label>

            <input
                type="text"
                name="name"
                value="{{ product.name }}"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
            >
        </div>


        <!-- Descrição -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Descrição
            </label>

            <textarea
                name="description"
                rows="5"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
            >{{ product.description or "" }}</textarea>
        </div>


        <div class="grid md:grid-cols-2 gap-6">

            <!-- Preço -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço (R$)
                </label>

                <input
                    type="number"
                    name="price"
                    step="0.01"
                    min="0"
                    value="{{ product.price }}"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                >
            </div>

            <!-- Estoque -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Estoque
                </label>

                <input
                    type="number"
                    name="stock"
                    min="0"
                    value="{{ product.stock }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                >
            </div>

        </div>


        <!-- Categoria -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Categoria
            </label>

            <input
                type="text"
                name="category"
                value="{{ product.category or '' }}"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="Feminino, Masculino, Infantil..."
            >
        </div>


        <!-- Imagem -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                URL da imagem
            </label>

            <input
                type="text"
                name="image"
                value="{{ product.image or '' }}"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
            >
        </div>


        <!-- Preview da imagem -->
        {% if product.image %}
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Pré-visualização
            </label>

            <img
                src="{{ product.image }}"
                alt="{{ product.name }}"
                class="w-48 rounded-xl border shadow"
            >
        </div>
        {% endif %}


        <!-- Produto ativo -->
        <div class="flex items-center gap-3">

            <input
                type="checkbox"
                name="is_active"
                id="is_active"
                class="w-5 h-5"
                {% if product.is_active %}checked{% endif %}
            >

            <label
                for="is_active"
                class="text-gray-700"
            >
                Produto disponível para venda
            </label>

        </div>


        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 text-white px-8 py-3 rounded-lg"
            >
                Salvar Alterações
            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 px-8 py-3 rounded-lg"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
