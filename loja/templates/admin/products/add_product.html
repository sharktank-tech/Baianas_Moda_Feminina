{% extends "base.html" %}

{% block title %}Adicionar Produto{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Adicionar Produto
        </h1>

        <p class="text-gray-500 mt-2">
            Cadastre um novo produto na loja.
        </p>
    </div>


    <form method="POST"
          class="bg-white rounded-2xl shadow p-8 space-y-6">

        {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome do produto
            </label>

            <input
                type="text"
                name="name"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="Ex: Vestido Floral">
        </div>


        <!-- Descrição -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Descrição
            </label>

            <textarea
                name="description"
                rows="5"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="Descreva o produto"></textarea>
        </div>


        <div class="grid md:grid-cols-2 gap-6">

            <!-- Preço -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Preço (R$)
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    required
                    name="price"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                    placeholder="0.00">
            </div>


            <!-- Estoque -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Estoque
                </label>

                <input
                    type="number"
                    min="0"
                    value="0"
                    name="stock"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500">
            </div>

        </div>


        <!-- Categoria -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Categoria
            </label>

            <input
                type="text"
                name="category"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                placeholder="Ex: Feminino, Masculino, Infantil">
        </div>


        <!-- Imagens (até 4) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {% for n in [1, 2, 3, 4] %}
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    URL da imagem {{ n }}
                </label>
                <input
                    type="text"
                    name="image{{ n }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500"
                    placeholder="https://...">
            </div>
            {% endfor %}
        </div>


        <!-- Produto ativo -->
        <div class="flex items-center gap-3">

            <input
                type="checkbox"
                id="is_active"
                name="is_active"
                checked
                class="w-5 h-5">

            <label for="is_active"
                   class="text-gray-700">
                Produto disponível para venda
            </label>

        </div>


        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 text-white px-8 py-3 rounded-lg">

                Salvar Produto

            </button>

            <a href="{{ url_for('admin.admin_dashboard') }}"
               class="bg-gray-200 hover:bg-gray-300 px-8 py-3 rounded-lg">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
