<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/animation.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.jpg') }}">
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-black text-white px-4 py-2 flex justify-between items-center">
    <h1 class="text-xl font-bold">Editar Produto</h1>
    <ul class="flex gap-4">
      <li><a href="/" class="hover:underline">Home</a></li>
      <li><a href="{{ url_for('admin.admin_dashboard') }}" class="hover:underline">Painel</a></li>
      <li><a href="{{ url_for('admin.logout') }}" class="hover:underline">Sair</a></li>
    </ul>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="mt-6 px-4 max-w-3xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-3xl font-bold mb-6">Editar Produto</h1>

    <form action="{{ url_for('admin.edit_product', id=product.id) }}" method="POST">
      <!-- Campo Nome -->
      <div class="mb-4">
        <label for="name" class="block text-gray-700 font-semibold mb-2">Nome do Produto</label>
        <input
          type="text"
          id="name"
          name="name"
          value="{{ product.name }}"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          required
        >
      </div>

      <!-- Campo Descrição -->
      <div class="mb-4">
        <label for="description" class="block text-gray-700 font-semibold mb-2">Descrição</label>
        <textarea
          id="description"
          name="description"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          rows="4"
        >{{ product.description }}</textarea>
      </div>

      <!-- Campo Preço -->
      <div class="mb-4">
        <label for="price" class="block text-gray-700 font-semibold mb-2">Preço</label>
        <input
          type="number"
          id="price"
          name="price"
          value="{{ product.price }}"
          step="0.01"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          required
        >
      </div>

      <!-- Campo Imagem -->
      <div class="mb-4">
        <label for="image" class="block text-gray-700 font-semibold mb-2">URL da Imagem</label>
        <input
          type="text"
          id="image"
          name="image"
          value="{{ product.image }}"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          required
        >
      </div>

      <!-- Botões -->
      <div class="flex justify-between items-center">
        <button
          type="submit"
          class="bg-black text-white py-2 px-4 rounded hover:bg-gray-800"
        >
          Salvar Alterações
        </button>
        <a
          href="{{ url_for('admin.admin_dashboard') }}"
          class="text-gray-500 hover:underline"
        >
          Cancelar
        </a>
      </div>
    </form>
  </main>

</body>
</html>
