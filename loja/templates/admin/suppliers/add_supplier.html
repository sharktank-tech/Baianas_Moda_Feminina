{% extends "base.html" %}

{% block title %}Adicionar Fornecedor{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            Adicionar Fornecedor
        </h1>

        <p class="text-gray-500 mt-2">
            Cadastre um novo fornecedor para os produtos da loja.
        </p>
    </div>

    <form
        method="POST"
        class="bg-white rounded-2xl shadow p-8 space-y-6"
    >

        <!-- Nome -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome do fornecedor
            </label>

            <input
                type="text"
                name="name"
                required
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Ex: Shein"
            >
        </div>

        <!-- Nome da empresa -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Nome da empresa
            </label>

            <input
                type="text"
                name="company_name"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Ex: Shein Brasil LTDA"
            >
        </div>

        <div class="grid md:grid-cols-2 gap-6">

            <!-- Telefone -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    Telefone
                </label>

                <input
                    type="text"
                    name="phone"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="(11) 99999-9999"
                >
            </div>

            <!-- E-mail -->
            <div>
                <label class="block font-medium text-gray-700 mb-2">
                    E-mail
                </label>

                <input
                    type="email"
                    name="email"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                    placeholder="contato@empresa.com"
                >
            </div>

        </div>

        <!-- Website -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Site do fornecedor
            </label>

            <input
                type="url"
                name="website"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="https://empresa.com"
            >
        </div>

        <!-- Endereço -->
        <div>
            <label class="block font-medium text-gray-700 mb-2">
                Endereço
            </label>

            <textarea
                name="address"
                rows="4"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-pink-500 focus:border-pink-500"
                placeholder="Rua, número, bairro, cidade..."
            ></textarea>
        </div>

        <!-- Botões -->
        <div class="flex gap-4 pt-4">

            <button
                type="submit"
                class="bg-pink-600 hover:bg-pink-700 transition text-white px-8 py-3 rounded-lg font-medium"
            >
                Salvar Fornecedor
            </button>

            <a
                href="{{ url_for('admin.admin_dashboard') }}"
                class="bg-gray-200 hover:bg-gray-300 transition px-8 py-3 rounded-lg font-medium"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
